name: Windows installer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set temporary data directory
        run: '"SCALARE_DATA=$env:RUNNER_TEMP\ScalareBuildData" >> $env:GITHUB_ENV'
      - name: Install dependencies
        run: python -m pip install -r requirements-desktop.txt
      - name: Run tests
        run: python -m unittest discover -v
      - name: Package desktop app
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name ScalareGenetics --add-data "assets;assets" desktop.py
      - name: Compile installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path -LiteralPath $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $compiler setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install and check startup
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'Scalare Install Test'
          $installer = Start-Process -FilePath '.\Output\ScalareGeneticsSetup.exe' -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$directory`"" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Installer exited with $($installer.ExitCode)" }
          $marker = Join-Path $env:RUNNER_TEMP 'scalare-smoke.txt'
          $app = Start-Process -FilePath (Join-Path $directory 'ScalareGenetics.exe') -ArgumentList "--smoke-test `"$marker`"" -PassThru
          if (!$app.WaitForExit(60000)) {
            $app.Kill()
            throw 'Desktop startup timed out'
          }
          if ($app.ExitCode -ne 0 -or !(Test-Path -LiteralPath $marker) -or (Get-Content -LiteralPath $marker -Raw) -ne 'OK') {
            throw "Desktop startup check failed with exit code $($app.ExitCode)"
          }
      - name: Package and check portable ZIP
        shell: pwsh
        run: |
          $zip = 'Output/ScalareGenetics-Portable.zip'
          Compress-Archive -Path 'dist/ScalareGenetics' -DestinationPath $zip
          $folder = Join-Path $env:RUNNER_TEMP 'Scalare Portable Test'
          Expand-Archive -LiteralPath $zip -DestinationPath $folder
          $marker = Join-Path $folder 'startup.txt'
          $app = Start-Process -FilePath (Join-Path $folder 'ScalareGenetics/ScalareGenetics.exe') -ArgumentList "--smoke-test `"$marker`"" -PassThru
          if (!$app.WaitForExit(60000)) {
            $app.Kill()
            throw 'Portable desktop startup timed out'
          }
          if ($app.ExitCode -ne 0 -or !(Test-Path -LiteralPath $marker) -or (Get-Content -LiteralPath $marker -Raw) -ne 'OK') {
            throw "Portable desktop startup check failed with exit code $($app.ExitCode)"
          }
      - name: Write checksums
        shell: pwsh
        run: |
          $hash = (Get-FileHash '.\Output\ScalareGeneticsSetup.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          $portableHash = (Get-FileHash './Output/ScalareGenetics-Portable.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          @("$hash  ScalareGeneticsSetup.exe", "$portableHash  ScalareGenetics-Portable.zip") | Set-Content '.\Output\SHA256.txt' -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: ScalareGenetics-Windows
          path: |
            Output/ScalareGeneticsSetup.exe
            Output/ScalareGenetics-Portable.zip
            Output/SHA256.txt
          if-no-files-found: error

      - name: Publish Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v0.14.1'
          $target = 'fab239e13737dae6e4b13d5cc6da2ae004af7e59'
          $notes = 'Windowsversion med installationsfil och portabel ZIP. För portabel start, extrahera ZIP-filen och öppna ScalareGenetics.exe i den uppackade mappen. Programmet visar nu ett felmeddelande om den lokala databasen inte kan öppnas vid start. Båda paketen är osignerade.'
          gh release create $tag Output/ScalareGeneticsSetup.exe Output/ScalareGenetics-Portable.zip Output/SHA256.txt --target $target --title 'Scalare Genetics Core v0.14.1' --notes $notes --draft
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --draft=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
